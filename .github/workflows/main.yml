name: Build KHALID OS Cloud ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'KHALID-OS-Cloud-1.0-source*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
  runs-on: ubuntu-22.04
  steps:
    - name: Download repository
      uses: actions/checkout@v4

    - name: Extract KHALID OS source
      run: |
        mkdir -p source
        ARCHIVE=$(find . -maxdepth 1 -type f -name 'KHALID-OS-Cloud-1.0-source*.zip' | head -n 1)
        if [ -z "$ARCHIVE" ]; then
          echo "ERROR: KHALID OS Cloud source ZIP is missing."
          exit 1
        fi
        unzip -q "$ARCHIVE" -d source

    - name: Build ISO with Debian
      run: |
        # العثور على المجلد الجذر المستخرج الذي يحتوي على مجلد scripts أو ملفات المشروع
        EXTRACTED_DIR="source"
        
        # التأكد من وجود سكريبت البناء وإعطاؤه الصلاحيات في مكانه الصحيح
        BUILD_SCRIPT=$(find "$EXTRACTED_DIR" -type f -name "build-iso.sh" | head -n 1)
        if [ -z "$BUILD_SCRIPT" ]; then
          echo "ERROR: build-iso.sh not found."
          exit 1
        fi
        
        chmod +x "$BUILD_SCRIPT"
        
        # تحديد المجلد الجذر للمشروع داخل الملفات المستخرجة لتشغيل دوكر عليه
        PROJECT_ROOT=$(dirname "$(dirname "$BUILD_SCRIPT")")
        
        docker run --privileged --rm \
          -v "$PWD/$PROJECT_ROOT:/work" \
          -w /work \
          debian:bookworm \
          bash -lc "apt-get update && apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common ca-certificates && ./scripts/build-iso.sh"

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: KHALID-OS-Cloud-ISO
        path: source/**/*.iso
        if-no-files-found: error
